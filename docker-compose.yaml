name: nimbus-local

# Local webhook demo. No cloud credentials or external delivery services are used.
services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:${NIMBUS_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${NIMBUS_GRPC_PORT:-9090}:9090"
    environment:
      PORT: "8080"
      GRPC_PORT: "9090"
      ENV: development
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: nimbus
      DB_PASSWORD: nimbus-local-demo
      DB_NAME: nimbus
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GRPC_AUTH_TOKENS: "dev-token-nimbus:00000000-0000-0000-0000-000000000001"
      # SDK clients are constructed at startup, but the demo sends only webhooks.
      # Fixed dummy values prevent accidental use of credentials from a host .env.
      AWS_ACCESS_KEY_ID: local-demo
      AWS_SECRET_ACCESS_KEY: local-demo
      AWS_SESSION_TOKEN: ""
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      SES_FROM_EMAIL: noreply@nimbus.local
      SQS_QUEUE_URL: ""
      SQS_DLQ_URL: ""
      OPENAI_API_KEY: ""
      WEBHOOK_TIMEOUT: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      webhook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      DATABASE_URL: postgres://nimbus:nimbus-local-demo@postgres:5432/nimbus?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    # Migration 003 requires the vector extension; the plain postgres image lacks it.
    image: pgvector/pgvector:0.8.7-pg15-trixie
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus-local-demo
      POSTGRES_DB: nimbus
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis_demo_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  webhook:
    image: python:3.12-alpine
    command: ["python", "-u", "/demo/webhook_receiver.py", "--port", "9080"]
    volumes:
      - ./scripts/local-demo:/demo:ro
    ports:
      - "127.0.0.1:${NIMBUS_WEBHOOK_PORT:-9080}:9080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  smoke:
    image: python:3.12-alpine
    profiles: ["tools"]
    command: ["python", "-u", "/demo/smoke.py"]
    volumes:
      - ./scripts/local-demo:/demo:ro
    environment:
      NIMBUS_BASE_URL: http://gateway:8080
      NIMBUS_WEBHOOK_CONTROL_URL: http://webhook:9080
      NIMBUS_WEBHOOK_DELIVERY_URL: http://webhook:9080
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default:
    # Containers can reach each other, but cannot call AWS/OpenAI or other hosts.
    internal: true

volumes:
  postgres_demo_data:
  redis_demo_data:
